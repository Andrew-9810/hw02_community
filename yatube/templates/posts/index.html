{% extends 'base.html' %}


{% block content %}
<h1>Последние обновления на сайте</h1>
<article>
  {% for var in posts %}
  <ul>
    <li>
      Автор: {{ var.author.get_full_name }}
    </li>
    <li>
      Дата публикации: {{ var.pub_date|date:"d E Y" }}
    </li>
  </ul>      
  <p>{{ var.text }}</p>
  <a href="">все записи группы</a>
  {% if not forloop.last %}<hr>{% endif %}
  {% endfor %}
  </article>
{% endblock %}
