{% load static %}
<header>
    <nav class="navbar navbar-light" style="background-color: lightskyblue">
      <div class="container">
        <!-- Из пространства имен получить адрес-->
        <a class="navbar-brand" href="{%url 'posts:index' %}">
          <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
          <!-- тег span используется для добавления нужных стилей отдельным участкам текста -->
          <span style="color:red">Ya</span>tube
        </a>
        {% if user.is_authenticated %}
          <!-- New  -->
        <li class="nav-item"> 
          <a class="nav-link link-light" href="{% url 'users:password_change' %}">
            <div class="card-header">
              Изменить пароль
            </div>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link link-light" href="{% url 'users:logout' %}">
            <div class="card-header">
              Выход
            </div>
          </a>
        </li>
        <li>
          Пользователь: {{user.username}}
        </li>
        {% else %}
        <li class="nav-item">
          <a class="nav-link link-light" href="{% url 'users:signup' %}">
            <div class="card-header">
              Зарегистрироваться
          </div>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link link-light" href="{% url 'users:login' %}">
            <div class="card-header">
              Войти
            </div>
          </a>
        </li>  
        {% endif %} 
      </div>
    </nav>      
</header>
