{% load static %}
<header>
    <!-- Использованы классы бустрапа для создания типовой навигации с логотипом -->
    <!-- В дальнейшем тут будет создано полноценное меню -->
    <nav class="navbar navbar-light" style="background-color: lightskyblue">
      <div class="container">
        <!-- Из пространства имен получить адрес-->
        <a class="navbar-brand" href="{%url 'posts:index' %}">
          <img src="{% static 'img/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="">
          <!-- тег span используется для добавления нужных стилей отдельным участкам текста -->
          <span style="color:red">Ya</span>tube
        </a>
        {% if user.is_authenticated %}
        <a href="{% url 'users:logout' %}">
          <div class="card-header">
            Выход
          </div>
        </a>
        <a href="{% url 'users:password_change' %}">
          <div class="card-header">
            Изменить пароль
          </div>
        </a>
        {% else %}
        <a href="{% url 'users:signup' %}">
          <div class="card-header">
            Зарегистрироваться
        </div>
        </a>
        <a href="{% url 'users:login' %}">
          <div class="card-header">
            Войти
          </div>
        </a>
        {% endif %} 
      </div>
    </nav>      
</header>
